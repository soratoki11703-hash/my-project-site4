<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>kazusora Takuma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  :root{--bg:#f5f4f1;--ink:#141412;--mid:#7a7a72;--soft:#dddbd4;--white:#ffffff;}
  html{scroll-behavior:smooth;font-size:150%;}
  body{background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif;font-weight:300;cursor:none;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
  #cur{position:fixed;width:5px;height:5px;background:var(--ink);border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);transition:width .25s,height .25s,background .25s;}
  #cur-o{position:fixed;width:26px;height:26px;border:1px solid rgba(20,20,18,.25);border-radius:50%;pointer-events:none;z-index:9998;transform:translate(-50%,-50%);transition:opacity .2s;}
  .cur-big #cur{width:44px;height:44px;background:rgba(20,20,18,.06);}
  .cur-big #cur-o{opacity:0;}
  .cur-white #cur{background:var(--white);}
  .cur-white #cur-o{border-color:rgba(255,255,255,.35);}

  nav{position:fixed;top:0;left:0;right:0;z-index:200;padding:1.8rem 3.5rem;display:flex;justify-content:space-between;align-items:center;transition:background .6s,border-color .6s;}
  nav.on-dark{background:transparent;border-bottom:1px solid transparent;}
  nav.on-light{background:rgba(245,244,241,.93);backdrop-filter:blur(14px);border-bottom:1px solid var(--soft);}
  .nav-logo{font-family:'Cormorant Garamond',serif;font-size:1rem;font-weight:300;letter-spacing:.12em;text-decoration:none;transition:color .3s;}
  nav.on-dark .nav-logo{color:var(--white);}
  nav.on-light .nav-logo{color:var(--ink);}
  .nav-links{display:flex;gap:2.5rem;list-style:none;}
  .nav-links a{font-size:.62rem;font-weight:400;letter-spacing:.18em;text-transform:uppercase;text-decoration:none;transition:color .2s;}
  nav.on-dark .nav-links a{color:rgba(255,255,255,.55);}
  nav.on-dark .nav-links a:hover{color:var(--white);}
  nav.on-light .nav-links a{color:var(--mid);}
  nav.on-light .nav-links a:hover{color:var(--ink);}

  /* SEC 1: HERO */
  .sec-hero{position:relative;height:100vh;overflow:hidden;}
  .hero-bg-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 20%;transition:opacity .6s;}
  .hero-veil{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.1) 0%,rgba(0,0,0,0) 40%,rgba(0,0,0,.68) 100%);}
  .hero-body{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:5rem 3.5rem;}
  .hero-tag{font-size:.58rem;letter-spacing:.32em;text-transform:uppercase;color:rgba(255,255,255,.5);margin-bottom:1.4rem;opacity:0;animation:fadeUp .8s .2s forwards;}
  .hero-h1{font-family:'Cormorant Garamond',serif;font-size:clamp(4rem,10vw,9rem);font-weight:300;line-height:.92;letter-spacing:-.01em;color:var(--white);opacity:0;animation:fadeUp 1s .4s forwards;}
  .hero-h1 em{font-style:italic;color:rgba(255,255,255,.55);}
  .hero-foot{margin-top:2.5rem;display:flex;justify-content:space-between;align-items:flex-end;opacity:0;animation:fadeUp .8s .7s forwards;}
  .hero-copy{font-size:.76rem;line-height:1.85;color:rgba(255,255,255,.65);max-width:300px;}
  .hero-scroll-wrap{display:flex;flex-direction:column;align-items:center;gap:.55rem;}
  .hero-scroll-label{font-size:.55rem;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.38);}
  .scroll-bar{width:1px;height:52px;background:rgba(255,255,255,.18);position:relative;overflow:hidden;}
  .scroll-bar::after{content:'';position:absolute;top:-100%;left:0;width:100%;height:100%;background:rgba(255,255,255,.7);animation:tickDown 2.2s 1.2s ease-in-out infinite;}
  @keyframes tickDown{0%{top:-100%}100%{top:100%}}
  .slide-indicators{position:absolute;bottom:2.8rem;left:50%;transform:translateX(-50%);display:flex;gap:.55rem;z-index:5;}
  .ind{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.28);cursor:none;transition:background .3s,transform .3s;}
  .ind.on{background:var(--white);transform:scale(1.4);}
  @keyframes fadeUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}

  /* SEC 2: WHO I AM */
  .sec-who{padding:9rem 3.5rem;background:var(--white);border-top:1px solid var(--soft);}
  .who-inner{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:1fr 1.6fr;gap:8rem;align-items:center;}
  .who-left{}
  .who-label{font-size:.58rem;letter-spacing:.28em;text-transform:uppercase;color:var(--mid);margin-bottom:2rem;display:flex;align-items:center;gap:1.2rem;}
  .who-label::before{content:'';display:block;width:28px;height:1px;background:var(--soft);}
  .who-name{font-family:'Cormorant Garamond',serif;font-size:clamp(3rem,6vw,5.5rem);font-weight:300;line-height:1.0;}
  .who-name .first{display:block;font-style:italic;color:var(--mid);}
  .who-name .last{display:block;font-weight:400;}
  .who-divider{width:36px;height:1px;background:var(--soft);margin:2.5rem 0;}
  .who-status{font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;color:var(--mid);}
  .who-right{}
  .who-lead{font-family:'Cormorant Garamond',serif;font-size:1.55rem;font-weight:300;line-height:1.7;color:var(--ink);margin-bottom:2rem;}
  .who-lead em{font-style:italic;color:var(--mid);}
  .who-body{font-size:.8rem;line-height:2.05;color:var(--mid);}
  .who-sns{margin-top:2.8rem;display:flex;gap:.8rem;}
  .sns-pill{display:inline-flex;align-items:center;gap:.5rem;padding:.65rem 1.4rem;border:1px solid var(--soft);font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);text-decoration:none;transition:all .25s;cursor:none;}
  .sns-pill:hover{background:var(--ink);border-color:var(--ink);color:var(--white);}

  /* SEC 3: WORKS */
  .sec-works{padding:7rem 3.5rem;max-width:1100px;margin:0 auto;}
  .sec-head{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:1.2rem;border-bottom:1px solid var(--soft);margin-bottom:3rem;}
  .sec-num{font-size:.58rem;letter-spacing:.22em;text-transform:uppercase;color:var(--soft);}
  .sec-title{font-family:'Cormorant Garamond',serif;font-size:1.7rem;font-weight:300;}
  .works-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:1.2rem;}
  .wcard{position:relative;overflow:hidden;display:block;text-decoration:none;color:inherit;cursor:none;}
  .wcard:nth-child(1){grid-column:1/8;}
  .wcard:nth-child(2){grid-column:8/13;}
  .wcard:nth-child(3){grid-column:1/5;}
  .wcard:nth-child(4){grid-column:5/9;}
  .wcard:nth-child(5){grid-column:9/13;}
  .wcard-img{width:100%;object-fit:cover;display:block;transition:transform .9s cubic-bezier(.25,.46,.45,.94),filter .5s;filter:grayscale(8%);}
  .wcard:nth-child(1) .wcard-img{aspect-ratio:16/10;}
  .wcard:nth-child(2) .wcard-img{aspect-ratio:3/4;}
  .wcard:nth-child(3) .wcard-img,.wcard:nth-child(4) .wcard-img,.wcard:nth-child(5) .wcard-img{aspect-ratio:4/3;}
  .wcard:hover .wcard-img{transform:scale(1.06);filter:grayscale(0%);}
  .wcard-veil{position:absolute;inset:0;background:linear-gradient(to top,rgba(20,20,18,.75) 0%,transparent 55%);opacity:0;transition:opacity .4s;display:flex;flex-direction:column;justify-content:flex-end;padding:1.6rem;}
  .wcard:hover .wcard-veil{opacity:1;}
  .wcard-n{font-size:.55rem;letter-spacing:.22em;text-transform:uppercase;color:rgba(245,244,241,.5);margin-bottom:.35rem;}
  .wcard-t{font-family:'Cormorant Garamond',serif;font-size:1.25rem;font-weight:300;color:var(--bg);line-height:1.2;}
  .wcard-arr{position:absolute;top:1.1rem;right:1.1rem;width:30px;height:30px;border:1px solid rgba(245,244,241,.35);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--bg);font-size:.8rem;opacity:0;transform:scale(.7);transition:opacity .3s,transform .3s;}
  .wcard:hover .wcard-arr{opacity:1;transform:scale(1);}

  /* SEC 4: STATEMENT */
  .sec-statement{padding:10rem 3.5rem;background:var(--ink);}
  .statement-inner{max-width:860px;margin:0 auto;text-align:center;}
  .st-label{font-size:.57rem;letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.25);margin-bottom:3.5rem;display:flex;align-items:center;justify-content:center;gap:1.5rem;}
  .st-label::before,.st-label::after{content:'';display:block;width:36px;height:1px;background:rgba(255,255,255,.12);}
  .st-quote{font-family:'Cormorant Garamond',serif;font-size:clamp(1.8rem,4.5vw,3.8rem);font-weight:300;line-height:1.5;letter-spacing:.01em;color:var(--white);}
  .st-quote em{font-style:italic;color:rgba(255,255,255,.4);}
  .st-divider{width:1px;height:60px;background:rgba(255,255,255,.12);margin:4rem auto;}
  .st-name{font-family:'Cormorant Garamond',serif;font-size:.9rem;letter-spacing:.22em;color:rgba(255,255,255,.35);}
  .st-sns{margin-top:3rem;display:flex;justify-content:center;gap:1rem;}
  .st-sns a{display:inline-flex;align-items:center;gap:.5rem;padding:.65rem 1.6rem;border:1px solid rgba(255,255,255,.16);font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.45);text-decoration:none;transition:all .3s;cursor:none;}
  .st-sns a:hover{border-color:rgba(255,255,255,.5);color:var(--white);}

  footer{padding:2.5rem 3.5rem;border-top:1px solid var(--soft);display:flex;justify-content:space-between;align-items:center;}
  footer p{font-size:.6rem;color:var(--soft);letter-spacing:.08em;}
  .ft-links{display:flex;gap:2rem;}
  .ft-links a{font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mid);text-decoration:none;transition:color .2s;}
  .ft-links a:hover{color:var(--ink);}

  .sr{opacity:0;transform:translateY(22px);transition:opacity .9s ease,transform .9s ease;}
  .sr.in{opacity:1;transform:none;}
@media(max-width:768px){
  html{font-size:112%;}
  nav{padding:1.2rem 1.5rem;}
  .nav-links{display:none;}
  .hero-body{padding:3rem 1.5rem;}
  .hero-foot{flex-direction:column;gap:1.5rem;align-items:flex-start;}
  .sec-who{padding:5rem 1.5rem;}
  .who-inner{grid-template-columns:1fr;gap:3rem;}
  .sec-works{padding:4rem 1.5rem;}
  .works-grid{grid-template-columns:1fr!important;display:flex;flex-direction:column;}
  .wcard{grid-column:unset!important;}
  .wcard-img{aspect-ratio:4/3!important;}
  .sec-statement{padding:6rem 1.5rem;}
  .st-quote{font-size:clamp(1.5rem,6vw,2.5rem);}
  .identity-inner{grid-template-columns:1fr;gap:3rem;}
  footer{flex-direction:column;gap:1rem;text-align:center;padding:2rem 1.5rem;}
  .ft-links{justify-content:center;}
  .id-sns,.who-sns,.st-sns{flex-wrap:wrap;}
}
@media(max-width:480px){
  html{font-size:100%;}
  .hero-h1{font-size:clamp(3rem,12vw,5rem);}
  .who-name{font-size:clamp(2.5rem,10vw,4rem);}
}
</head>
<body>
<div id="cur"></div>
<div id="cur-o"></div>

<nav id="nav" class="on-dark">
  <a href="index.html" class="nav-logo">kazusora Takuma</a>
  <ul class="nav-links">
    <li><a href="#about">About</a></li>
    <li><a href="#works">Photos</a></li>
    <li><a href="#statement">Contact</a></li>
  </ul>
</nav>

<!-- SEC 1: HERO -->
<section class="sec-hero" id="hero">
  <img src="photo4.jpeg" alt="Hero" class="hero-bg-img" id="heroBg">
  <div class="hero-veil"></div>
  <div class="hero-body">
    <p class="hero-tag">kazusora Takuma — Personal Portfolio</p>
    <h1 class="hero-h1">Just a guy<br><em>living fully.</em></h1>
    <div class="hero-foot">
      <p class="hero-copy">旅して、話して、生きてる。<br>それが俺、kazusora Takuma。</p>
      <div class="hero-scroll-wrap">
        <span class="hero-scroll-label">Scroll</span>
        <div class="scroll-bar"></div>
      </div>
    </div>
  </div>
  <div class="slide-indicators">
    <div class="ind on" data-i="0"></div>
    <div class="ind" data-i="1"></div>
    <div class="ind" data-i="2"></div>
    <div class="ind" data-i="3"></div>
    <div class="ind" data-i="4"></div>
  </div>
</section>

<!-- SEC 2: WHO I AM -->
<section class="sec-who" id="about">
  <div class="who-inner">
    <div class="who-left sr">
      <div class="who-label">Who I am</div>
      <div class="who-name">
        <span class="first">kazusora</span>
        <span class="last">Takuma</span>
      </div>
      <div class="who-divider"></div>
      <div class="who-status">Student — Tokyo, Japan</div>
    </div>
    <div class="who-right sr" style="transition-delay:.18s">
      <p class="who-lead">
        kazusora Takumaとは、<em>どこへでも行き、誰とでも話せる</em>人間だ。
      </p>
      <p class="who-body">東京の学生。でも教室に収まりきらないタイプ。気づいたら知らない街を歩いていて、気づいたら初対面の人と深い話をしている。旅が好きなのは、移動することで「自分がどんな人間か」が少しずつ見えてくるから。人と話すのが好きなのは、相手の中に必ず自分にない何かがあるから。ファッションへのこだわりは、服が「今日の自分」を語る言語だと思っているから。kazusora Takumaという人間は、まだ途中だ。でも、その途中がいちばんおもしろい。</p>
      <div class="who-sns">
        <a href="https://www.instagram.com/" target="_blank" class="sns-pill">Instagram →</a>
        <a href="https://note.com/" target="_blank" class="sns-pill">Note →</a>
      </div>
    </div>
  </div>
</section>

<!-- SEC 3: PHOTOS -->
<section id="works">
  <div class="sec-works">
    <div class="sec-head sr">
      <span class="sec-num">My World</span>
      <span class="sec-title">Photos</span>
    </div>
    <div class="works-grid">
      <a href="work1.html" class="wcard sr">
        <img src="photo1.jpeg" alt="Mirror Morning" class="wcard-img">
        <div class="wcard-veil"><div class="wcard-n">01</div><div class="wcard-t">Mirror Morning</div></div>
        <div class="wcard-arr">→</div>
      </a>
      <a href="work2.html" class="wcard sr" style="transition-delay:.1s">
        <img src="photo2.jpeg" alt="Golden Shade" class="wcard-img">
        <div class="wcard-veil"><div class="wcard-n">02</div><div class="wcard-t">Golden Shade</div></div>
        <div class="wcard-arr">→</div>
      </a>
      <a href="work3.html" class="wcard sr" style="transition-delay:.2s">
        <img src="photo3.jpeg" alt="Glowing Eyes" class="wcard-img">
        <div class="wcard-veil"><div class="wcard-n">03</div><div class="wcard-t">Glowing Eyes</div></div>
        <div class="wcard-arr">→</div>
      </a>
      <a href="work4.html" class="wcard sr" style="transition-delay:.3s">
        <img src="photo4.jpeg" alt="Open Sky" class="wcard-img">
        <div class="wcard-veil"><div class="wcard-n">04</div><div class="wcard-t">Open Sky</div></div>
        <div class="wcard-arr">→</div>
      </a>
      <a href="work5.html" class="wcard sr" style="transition-delay:.4s">
        <img src="photo5.jpeg" alt="Horizon" class="wcard-img">
        <div class="wcard-veil"><div class="wcard-n">05</div><div class="wcard-t">Horizon</div></div>
        <div class="wcard-arr">→</div>
      </a>
    </div>
  </div>
</section>

<!-- SEC 4: STATEMENT -->
<section class="sec-statement" id="statement">
  <div class="statement-inner">
    <div class="st-label sr">— kazusora Takuma —</div>
    <p class="st-quote sr" style="transition-delay:.1s">
      「行ったことのない場所へ行き、<br>
      会ったことのない人と話す。<br>
      <em>それが俺の生き方だ。</em>」
    </p>
    <div class="st-divider sr" style="transition-delay:.2s"></div>
    <p class="st-name sr" style="transition-delay:.25s">kazusora Takuma — Student, Tokyo</p>
    <div class="st-sns sr" style="transition-delay:.35s">
      <a href="https://www.instagram.com/" target="_blank">Instagram →</a>
      <a href="https://note.com/" target="_blank">Note →</a>
    </div>
  </div>
</section>

<footer>
  <p>© 2026 kazusora Takuma. All Rights Reserved.</p>
  <div class="ft-links">
    <a href="https://www.instagram.com/" target="_blank">Instagram</a>
    <a href="https://note.com/" target="_blank">Note</a>
  </div>
</footer>

<script>
  const cur=document.getElementById('cur'),curo=document.getElementById('cur-o');
  let mx=0,my=0,ox=0,oy=0;
  document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;cur.style.left=mx+'px';cur.style.top=my+'px';});
  (function l(){ox+=(mx-ox)*.13;oy+=(my-oy)*.13;curo.style.left=ox+'px';curo.style.top=oy+'px';requestAnimationFrame(l);})();
  document.querySelectorAll('a,.wcard,.ind').forEach(el=>{
    el.addEventListener('mouseenter',()=>document.body.classList.add('cur-big'));
    el.addEventListener('mouseleave',()=>document.body.classList.remove('cur-big'));
  });
  const nav=document.getElementById('nav'),heroEl=document.getElementById('hero'),stEl=document.getElementById('statement');
  window.addEventListener('scroll',()=>{
    const sy=window.scrollY,heroH=heroEl.offsetHeight,stTop=stEl.offsetTop,stBot=stTop+stEl.offsetHeight;
    const inDark=sy<heroH-80||(sy>=stTop-80&&sy<stBot-80);
    nav.className=inDark?'on-dark':'on-light';
    document.body.classList.toggle('cur-white',sy<heroH-80);
  });
  const imgs=['photo4.jpeg','photo3.jpeg','photo5.jpeg','photo1.jpeg','photo2.jpeg'];
  const heroBg=document.getElementById('heroBg');
  const inds=document.querySelectorAll('.ind');
  let ci=0;
  function goSlide(n){ci=n;heroBg.style.opacity='0';setTimeout(()=>{heroBg.src=imgs[ci];heroBg.style.opacity='1';},400);inds.forEach((d,i)=>d.classList.toggle('on',i===ci));}
  setInterval(()=>goSlide((ci+1)%imgs.length),5000);
  inds.forEach(d=>d.addEventListener('click',()=>goSlide(+d.dataset.i)));
  new IntersectionObserver(([e])=>document.body.classList.toggle('cur-white',e.isIntersecting),{threshold:.5}).observe(heroEl);
  const obs=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('in');}),{threshold:.08});
  document.querySelectorAll('.sr').forEach(el=>obs.observe(el));
</script>
</body>
</html>
